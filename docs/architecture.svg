<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" font-family="Segoe UI, Poppins, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#005c9f"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4362e4"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .band { fill: #f8fbff; stroke: #d6eafa; stroke-width: 1.5; }
      .bandl { font-size: 12px; font-weight: 700; fill: #005c9f; letter-spacing: 1.2px; }
      .box { fill: #ffffff; stroke: #74b4e8; stroke-width: 1.5; }
      .hd { fill: #0071c2; }
      .ht { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .t { font-size: 12px; fill: #1e293b; }
      .s { font-size: 11px; fill: #475569; }
      .b { font-weight: 700; fill: #003864; }
      .chip { fill: #eef6fd; stroke: #acd3f3; }
      .llm { fill: #eff3ff; stroke: #8fa7f8; }
      .llmt { font-size: 11px; fill: #273ba8; font-weight: 600; }
      .rule { fill: #d6eafa; stroke: #74b4e8; }
      .rulet { font-size: 11px; fill: #003864; font-weight: 600; }
      .ln { stroke: #005c9f; stroke-width: 1.8; fill: none; }
      .lv { stroke: #4362e4; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .lg { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 7 4; }
      .user { fill: #003864; }
      .usert { font-size: 13px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="40" font-size="26" font-weight="700" fill="#003864">ClaimShield: Solution Architecture</text>
  <text x="30" y="64" font-size="14" fill="#475569">Multi-agent AI fraud detection for health-insurance reimbursement claims, with a human in the loop</text>

  <!-- users -->
  <g>
    <rect class="user" x="230" y="86" width="260" height="44" rx="22"/>
    <text class="usert" x="360" y="113" text-anchor="middle">Policyholder (customer)</text>
    <rect class="user" x="700" y="86" width="260" height="44" rx="22"/>
    <text class="usert" x="830" y="113" text-anchor="middle">Investigator · Fraud team</text>
    <rect class="user" x="1150" y="86" width="270" height="44" rx="22"/>
    <text class="usert" x="1285" y="113" text-anchor="middle">Ops manager · Administrator</text>
  </g>
  <path class="ln" d="M360,130 V190" marker-end="url(#a)"/>
  <path class="ln" d="M830,130 C830,160 1000,160 1000,190" marker-end="url(#a)"/>
  <path class="ln" d="M1285,130 C1285,160 1240,160 1240,190" marker-end="url(#a)"/>

  <!-- presentation -->
  <rect class="band" x="30" y="150" width="1540" height="160" rx="10"/>
  <text class="bandl" x="48" y="172">PRESENTATION · React 19 · TypeScript · Vite · Tailwind CSS · Poppins</text>

  <rect class="box" x="60" y="190" width="700" height="108" rx="8"/>
  <rect class="hd" x="60" y="190" width="700" height="28" rx="8"/><rect class="hd" x="60" y="206" width="700" height="12"/>
  <text class="ht" x="76" y="209">Customer journey  ( / )</text>
  <text class="t" x="76" y="240">Policy → Hospital &amp; treatment → Bill → Documents → Review &amp; submit</text>
  <text class="t" x="76" y="260">Live processing · Claim report (outcome, next step, checks) · Insights · Demo scenarios</text>
  <text class="s" x="76" y="284">Customer-safe view: never shows scores, findings, agent names or the investigator's reason</text>

  <rect class="box" x="840" y="190" width="700" height="108" rx="8"/>
  <rect class="hd" x="840" y="190" width="700" height="28" rx="8"/><rect class="hd" x="840" y="206" width="700" height="12"/>
  <text class="ht" x="856" y="209">Internal console  ( /internal )</text>
  <text class="t" x="856" y="240">Claims list and status filters · AI summary · Execution timeline · How the score was decided</text>
  <text class="t" x="856" y="260">Agent cards (rule vs LLM findings) · Document preview and download · Approve / Reject</text>
  <text class="s" x="856" y="284">Login with JWT · decisions by Investigator and Fraud team only</text>

  <path class="ln" d="M410,298 V346" marker-end="url(#a)"/>
  <path class="ln" d="M1190,298 V346" marker-end="url(#a)"/>

  <!-- api -->
  <rect class="band" x="30" y="326" width="1540" height="104" rx="10"/>
  <text class="bandl" x="48" y="346">REST API · FastAPI · Uvicorn · Pydantic 2 · one error envelope</text>
  <g>
    <rect class="chip" x="48" y="358" width="238" height="58" rx="6"/>
    <text class="t b" x="60" y="380">Auth and roles</text><text class="s" x="60" y="400">JWT (30 min) · Argon2 · 4 roles</text>
    <rect class="chip" x="300" y="358" width="238" height="58" rx="6"/>
    <text class="t b" x="312" y="380">Customer routes</text><text class="s" x="312" y="400">policy lookup · submit · status</text>
    <rect class="chip" x="552" y="358" width="238" height="58" rx="6"/>
    <text class="t b" x="564" y="380">Internal routes</text><text class="s" x="564" y="400">claims list · detail · documents</text>
    <rect class="chip" x="804" y="358" width="238" height="58" rx="6"/>
    <text class="t b" x="816" y="380">Decisions</text><text class="s" x="816" y="400">approve · deny · reason · history</text>
    <rect class="chip" x="1056" y="358" width="238" height="58" rx="6"/>
    <text class="t b" x="1068" y="380">Demo</text><text class="s" x="1068" y="400">scenarios · generated PDFs · signed files</text>
    <rect class="chip" x="1308" y="358" width="246" height="58" rx="6"/>
    <text class="t b" x="1320" y="380">Cross-cutting</text><text class="s" x="1320" y="400">rate limits · audit · structured logs</text>
  </g>
  <path class="ln" d="M170,416 V510" marker-end="url(#a)"/>

  <!-- processing -->
  <rect class="band" x="30" y="450" width="1540" height="320" rx="10"/>
  <text class="bandl" x="48" y="472">PROCESSING PIPELINE · per claim, in the background</text>

  <!-- intake -->
  <rect class="box" x="48" y="510" width="150" height="200" rx="8"/>
  <text class="t b" x="60" y="534">Intake &amp; policy</text><text class="t b" x="60" y="550">rules</text>
  <text class="s" x="60" y="576">network hospital</text>
  <text class="s" x="60" y="594">covered condition</text>
  <text class="s" x="60" y="612">policy period</text>
  <text class="s" x="60" y="630">≤ sum insured</text>
  <text class="s" x="60" y="648">≤ 10 files × 10 MB</text>
  <text class="s" x="60" y="676">refusals stored for</text>
  <text class="s" x="60" y="692">review (422)</text>
  <path class="ln" d="M198,610 H220" marker-end="url(#a)"/>

  <!-- orchestrator -->
  <rect class="box" x="222" y="510" width="150" height="200" rx="8"/>
  <text class="t b" x="234" y="534">Orchestrator</text><text class="t b" x="234" y="550">+ job runner</text>
  <text class="s" x="234" y="576">agents in parallel</text>
  <text class="s" x="234" y="594">timeout 30 s</text>
  <text class="s" x="234" y="612">retries</text>
  <text class="s" x="234" y="630">validate + merge</text>
  <text class="s" x="234" y="648">findings</text>
  <text class="s" x="234" y="676">live stage events</text>
  <text class="s" x="234" y="692">for both screens</text>
  <path class="ln" d="M372,610 H394" marker-end="url(#a)"/>

  <!-- agents -->
  <rect class="box" x="396" y="488" width="600" height="268" rx="8"/>
  <rect class="hd" x="396" y="488" width="600" height="30" rx="8"/><rect class="hd" x="396" y="505" width="600" height="13"/>
  <text class="ht" x="412" y="508">Five specialist agents (run in parallel)</text>
  <text x="982" y="508" font-size="11" fill="#d6eafa" text-anchor="end">weight</text>
  <g>
    <!-- row template: name, weight, rules chip, llm chip -->
    <text class="t b" x="412" y="548">Invoice Validation</text>
    <rect class="rule" x="572" y="532" width="160" height="24" rx="5"/><text class="rulet" x="582" y="548">Rules: amounts, duplicates,</text>
    <rect class="llm" x="742" y="532" width="190" height="24" rx="5"/><text class="llmt" x="752" y="548">LLM review + tools</text>
    <text class="t b" x="982" y="548" text-anchor="end">25%</text>
    <text class="s" x="582" y="568">payment, GST, cost vs diagnosis</text>

    <text class="t b" x="412" y="598">Document Forensics</text>
    <rect class="rule" x="572" y="582" width="160" height="24" rx="5"/><text class="rulet" x="582" y="598">Rules: metadata, edits,</text>
    <rect class="llm" x="742" y="582" width="190" height="24" rx="5"/><text class="llmt" x="752" y="598">LLM review + tools</text>
    <text class="t b" x="982" y="598" text-anchor="end">25%</text>
    <text class="s" x="582" y="618">reuse, documents vs claim</text>

    <text class="t b" x="412" y="648">Medical Review</text>
    <rect class="rule" x="572" y="632" width="160" height="24" rx="5"/><text class="rulet" x="582" y="648">Rules: ICD, medicines,</text>
    <rect class="llm" x="742" y="632" width="190" height="24" rx="5"/><text class="llmt" x="752" y="648">LLM review + tools</text>
    <text class="t b" x="982" y="648" text-anchor="end">20%</text>
    <text class="s" x="582" y="668">lab verification, treatment</text>

    <text class="t b" x="412" y="698">Provider Profile</text>
    <rect class="rule" x="572" y="682" width="160" height="24" rx="5"/><text class="rulet" x="582" y="698">Rules: registry, GSTIN,</text>
    <rect class="llm" x="742" y="682" width="190" height="24" rx="5"/><text class="llmt" x="752" y="698">LLM review + tools</text>
    <text class="t b" x="982" y="698" text-anchor="end">15%</text>
    <text class="s" x="582" y="718">licence, specialty, volume</text>

    <text class="t b" x="412" y="740">User Profile</text>
    <rect class="rule" x="572" y="726" width="160" height="22" rx="5"/><text class="rulet" x="582" y="741">Rules: history, frequency</text>
    <rect class="llm" x="742" y="726" width="190" height="22" rx="5"/><text class="llmt" x="752" y="741">LLM review + tools</text>
    <text class="t b" x="982" y="741" text-anchor="end">15%</text>
  </g>
  <path class="ln" d="M996,610 H1018" marker-end="url(#a)"/>

  <!-- scoring -->
  <rect class="box" x="1020" y="510" width="170" height="200" rx="8"/>
  <text class="t b" x="1032" y="534">Weighted scoring</text>
  <text class="s" x="1032" y="560">points = severity ×</text>
  <text class="s" x="1032" y="576">status (0.6 / 1.0)</text>
  <text class="s" x="1032" y="598">same fact counted once</text>
  <text class="s" x="1032" y="620">agent score × weight × 5</text>
  <text class="s" x="1032" y="642">+ LLM points</text>
  <text class="s" x="1032" y="658">(≤ 15 / agent, ≤ 25 total)</text>
  <text class="s" x="1032" y="684">final capped at 100</text>
  <path class="ln" d="M1190,610 H1208" marker-end="url(#a)"/>

  <!-- routing -->
  <rect class="box" x="1210" y="510" width="168" height="200" rx="8"/>
  <text class="t b" x="1222" y="534">Routing</text>
  <rect x="1222" y="548" width="144" height="40" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1230" y="564" font-size="11" font-weight="700" fill="#065f46">&lt; 30 low risk</text>
  <text x="1230" y="580" font-size="10.5" fill="#065f46">auto-approve if &lt; ₹2,000</text>
  <rect x="1222" y="596" width="144" height="40" rx="5" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="1230" y="612" font-size="11" font-weight="700" fill="#92400e">30 – 60 manual review</text>
  <text x="1230" y="628" font-size="10.5" fill="#92400e">(also low risk ≥ ₹2,000)</text>
  <rect x="1222" y="644" width="144" height="40" rx="5" fill="#fff1f2" stroke="#fda4af"/>
  <text x="1230" y="660" font-size="11" font-weight="700" fill="#9f1239">≥ 60 investigate</text>
  <text x="1230" y="676" font-size="10.5" fill="#9f1239">verification team</text>
  <path class="ln" d="M1378,610 H1396" marker-end="url(#a)"/>

  <!-- summary + views -->
  <rect class="box" x="1398" y="510" width="156" height="200" rx="8"/>
  <text class="t b" x="1410" y="534">AI summary</text>
  <text class="s" x="1410" y="556">why flagged</text>
  <text class="s" x="1410" y="572">what to investigate</text>
  <text class="s" x="1410" y="588">(rules-only fallback)</text>
  <text class="t b" x="1410" y="618">Views</text>
  <text class="s" x="1410" y="640">customer: outcome,</text>
  <text class="s" x="1410" y="656">next step, timeline</text>
  <text class="s" x="1410" y="678">internal: findings,</text>
  <text class="s" x="1410" y="694">scores, documents</text>

  <!-- human in the loop -->
  <path class="lg" d="M1554,560 H1580 V244 H1542" marker-end="url(#ag)"/>
  <rect x="1446" y="440" width="128" height="34" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="1510" y="454" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">Human in the loop</text>
  <text x="1510" y="467" font-size="10" fill="#065f46" text-anchor="middle">investigator decides</text>

  <!-- AI services -->
  <rect class="band" x="30" y="790" width="1540" height="104" rx="10" style="fill:#f7f8ff;stroke:#dce5ff"/>
  <text class="bandl" x="48" y="810" style="fill:#273ba8">AI SERVICES · LLM never decides on its own</text>
  <rect class="llm" x="396" y="822" width="230" height="60" rx="6"/>
  <text class="t" x="408" y="845" style="font-weight:700;fill:#1f2c6b">Google Gemini API</text>
  <text class="s" x="408" y="864">function calling · model fallback chain</text>
  <rect class="llm" x="640" y="822" width="210" height="60" rx="6"/>
  <text class="t" x="652" y="845" style="font-weight:700;fill:#1f2c6b">Privacy layer</text>
  <text class="s" x="652" y="864">pseudonyms · redacted text · no PII logs</text>
  <rect class="llm" x="864" y="822" width="360" height="60" rx="6"/>
  <text class="t" x="876" y="845" style="font-weight:700;fill:#1f2c6b">Agent tools</text>
  <text class="s" x="876" y="864">document text · bill details · hospital &amp; doctor · history · clinical ref · lab check</text>
  <rect class="llm" x="1238" y="822" width="316" height="60" rx="6"/>
  <text class="t" x="1250" y="845" style="font-weight:700;fill:#1f2c6b">Guardrails</text>
  <text class="s" x="1250" y="864">findings ≤ medium · document text is data, not instructions</text>
  <path class="lv" d="M836,756 V820" marker-end="url(#av)"/>
  <text x="844" y="792" font-size="10.5" fill="#4362e4">LLM review (each agent)</text>
  <path class="lv" d="M1476,710 V820" marker-end="url(#av)"/>
  <text x="1484" y="776" font-size="10.5" fill="#4362e4">summary</text>

  <!-- data -->
  <rect class="band" x="30" y="914" width="1540" height="150" rx="10" style="fill:#f8fafc;stroke:#e2e8f0"/>
  <text class="bandl" x="48" y="934" style="fill:#334155">DATA &amp; CONFIGURATION</text>
  <g>
    <rect x="48" y="948" width="300" height="102" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text class="t b" x="60" y="970">Database · SQLite / PostgreSQL</text>
    <text class="s" x="60" y="990">claims · invoices · document hashes</text>
    <text class="s" x="60" y="1006">findings · decisions · users · settings</text>
    <text class="s" x="60" y="1022">audit_events (append-only hash chain)</text>
    <text class="s" x="60" y="1038">SQLAlchemy 2 · Alembic</text>

    <rect x="362" y="948" width="290" height="102" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text class="t b" x="374" y="970">Rule configuration (YAML)</text>
    <text class="s" x="374" y="990">points, bands 30 / 60, agent weights</text>
    <text class="s" x="374" y="1006">auto-approve limit ₹2,000 · LLM caps</text>
    <text class="s" x="374" y="1022">provider and user thresholds</text>
    <text class="s" x="374" y="1038">clinical reference (ICD, medicines)</text>

    <rect x="666" y="948" width="280" height="102" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text class="t b" x="678" y="970">Reference data (SIMULATED)</text>
    <text class="s" x="678" y="990">hospitals · doctors · licences</text>
    <text class="s" x="678" y="1006">policies · claim history</text>
    <text class="s" x="678" y="1022">lab registry (verification codes)</text>
    <text class="s" x="678" y="1038">synthetic data only</text>

    <rect x="960" y="948" width="280" height="102" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text class="t b" x="972" y="970">In-memory job store</text>
    <text class="s" x="972" y="990">live stages and timeline events</text>
    <text class="s" x="972" y="1006">full assessment for the console</text>
    <text class="s" x="972" y="1022">uploaded files for preview</text>
    <text class="s" x="972" y="1038">(lost on restart; queue planned)</text>

    <rect x="1254" y="948" width="300" height="102" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text class="t b" x="1266" y="970">Security</text>
    <text class="s" x="1266" y="990">secrets in .env (JWT secret, API key)</text>
    <text class="s" x="1266" y="1006">roles on every route · access audited</text>
    <text class="s" x="1266" y="1022">demo claims kept out of history</text>
    <text class="s" x="1266" y="1038">(token or HMAC-signed files)</text>
  </g>
  <path class="ln" d="M297,710 V946" marker-end="url(#a)"/>
  <text x="305" y="800" font-size="10.5" fill="#005c9f">history · registry</text>
  <text x="305" y="815" font-size="10.5" fill="#005c9f">duplicates · rules</text>

  <!-- legend -->
  <g font-size="11" fill="#475569">
    <rect x="30" y="1082" width="14" height="10" fill="#d6eafa" stroke="#74b4e8"/><text x="50" y="1091">Deterministic rules and application code</text>
    <rect x="300" y="1082" width="14" height="10" fill="#eff3ff" stroke="#8fa7f8"/><text x="320" y="1091">LLM (capped, advisory)</text>
    <line x1="500" y1="1087" x2="526" y2="1087" class="lg"/><text x="534" y="1091">Human decision</text>
    <rect x="660" y="1082" width="14" height="10" fill="#fff" stroke="#94a3b8"/><text x="680" y="1091">Data and configuration</text>
    <text x="1570" y="1091" text-anchor="end">Planned: OCR (Textract), S3 documents, SQS worker, image forensics, real registries</text>
  </g>
</svg>
