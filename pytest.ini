[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    check_id(id): ties a test to a design check identifier (e.g. check_id("C-01"))
    postgres: requires a reachable PostgreSQL instance (skipped otherwise)
    live_llm: calls the real Gemini API (never run by default)
addopts = -m "not live_llm"
